<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21172D">
  <title>Ruleta de premios | BBV</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="wheel-page">
  <main class="wheel-shell">
    <header class="wheel-top">
      <span class="brand"><img class="bbv-logo bbv-logo-light" src="/bbv-logo.svg" alt="BBV Bolsa Boliviana de Valores"><span class="brand-title">Ruleta de premios</span></span>
      <div class="wheel-top-actions"><button class="btn btn-ghost btn-sm" style="color:white;border-color:rgba(255,255,255,.2)" id="wheelLogout" type="button">Cerrar ruleta</button><button class="btn btn-light btn-sm" id="fullscreenButton" type="button">⛶ Proyectar</button></div>
    </header>

    <section class="wheel-grid">
      <div class="wheel-area">
        <div class="wheel-wrap"><div class="wheel-pointer"></div><canvas id="wheelCanvas" width="900" height="900"></canvas><div class="wheel-center">GIRA<br>Y GANA</div></div>
      </div>
      <aside class="wheel-control">
        <span class="eyebrow">Premios disponibles</span>
        <h1>¡Es momento de girar!</h1>
        <p>Selecciona a una persona registrada. Cada premio se descuenta automáticamente del inventario.</p>
        <div class="field dark-field"><label for="attendeeSelect">Participante</label><select id="attendeeSelect"><option value="">Selecciona un participante</option></select></div>
        <button class="btn spin-btn" id="spinButton" type="button">✦ Girar la ruleta</button>
        <div class="inventory" id="inventory"></div>
        <div style="margin-top:18px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px">
          <div class="panel-header" style="margin-bottom:10px"><div><h3 style="color:white">Últimos ganadores</h3></div></div>
          <div id="recentSpins" style="display:grid;gap:7px"></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="winner-modal" id="winnerModal">
    <article class="winner-card"><span class="eyebrow">¡Tenemos premio!</span><img id="winnerImage" alt="Premio"><p id="winnerPerson">Participante</p><h2 id="winnerPrize">Premio</h2><p>Acércate al equipo organizador para recibirlo.</p><button class="btn btn-green btn-lg" id="closeWinner" type="button">Continuar</button></article>
  </div>
  <div class="toast"></div>
  <script type="module" src="/wheel.js"></script>
</body>
</html>
