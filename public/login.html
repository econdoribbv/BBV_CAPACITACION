<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#654388">
  <title>Acceso de organizadores | Conecta & Participa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <section class="login-art">
      <a class="brand" href="/"><img class="bbv-logo bbv-logo-light" src="/bbv-logo.svg" alt="BBV Bolsa Boliviana de Valores"></a>
      <div><div class="login-shapes"><span></span><span></span><span></span></div><h1>Conecta & Participa</h1><p>Gestiona registros, proyecta el QR y controla el cuestionario de la Bolsa Boliviana de Valores.</p></div>
    </section>
    <section class="login-form">
      <span class="eyebrow">Acceso privado</span>
      <h2>Organizadores</h2>
      <p>Ingresa tus credenciales para abrir el panel.</p>
      <form id="loginForm">
        <div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" placeholder="Tu usuario" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <button class="btn btn-green btn-lg" type="submit">Ingresar al panel →</button>
      </form>
      <a class="back-link" href="/">← Volver al registro</a>
    </section>
  </main>
  <div class="toast"></div>
  <script type="module" src="/login.js"></script>
</body>
</html>
