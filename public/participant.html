<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#36BC87">
  <title>Mi desafío | Conecta & Participa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="participant-page bg-orbs">
  <header class="topbar">
    <span class="brand"><img class="bbv-logo" src="/bbv-logo.svg" alt="BBV Bolsa Boliviana de Valores"><span class="brand-title">Conecta & Participa</span></span>
  </header>
  <main class="participant-main">
    <section class="participant-head">
      <div><span class="eyebrow">Participante</span><h1 id="greeting">¡Hola!</h1><p>Tu pantalla personal del cuestionario</p></div>
      <div class="score-chip"><small>Mi puntaje · posición <span id="rank">—</span></small><strong id="score">0 pts</strong></div>
    </section>
    <section class="card game-card" id="gameCard"><div class="waiting"><div class="waiting-visual"><span>✦</span></div><h2>Conectando…</h2></div></section>
    <section id="prizeArea"></section>
  </main>
  <div class="toast"></div>
  <script type="module" src="/participant.js"></script>
</body>
</html>
