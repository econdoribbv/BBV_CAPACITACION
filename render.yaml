services:
  - type: web
    name: conecta-y-participa-bbv
    runtime: node
    # Existing services keep their current plan. Free registration is enabled.
    # Without a mounted disk, data is temporary. See DEPLOY_RENDER.md.
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
