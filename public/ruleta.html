<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#654388">
  <title>Acceso a la ruleta | BBV</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <section class="login-art">
      <img class="bbv-logo bbv-logo-light" src="/bbv-logo.svg" alt="BBV Bolsa Boliviana de Valores">
      <div><div class="login-shapes"><span></span><span></span><span></span></div><h1>Ruleta de premios</h1><p>Esta actividad funciona de manera independiente al cuestionario Conecta & Participa.</p></div>
    </section>
    <section class="login-form">
      <span class="eyebrow">Acceso exclusivo</span>
      <h2>Abrir la ruleta</h2>
      <p>Ingresa como organizador para gestionar premios.</p>
      <form id="rouletteLoginForm">
        <div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-green btn-lg" type="submit">Entrar a la ruleta →</button>
      </form>
    </section>
  </main>
  <div class="toast"></div>
  <script type="module" src="/ruleta-login.js"></script>
</body>
</html>
